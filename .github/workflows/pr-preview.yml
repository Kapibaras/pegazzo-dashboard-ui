name: PR Preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]

env:
  IMAGE: registry.pegazzoauto.com/pegazzo-dashboard
  DOKPLOY_URL: https://dokploy.pegazzoauto.com
  ENVIRONMENT_ID: crDU2qwVwHyWxt7MA6pAH
  REGISTRY_ID: jZWcFpEWGMSFYD2A-3eb2

jobs:
  deploy-preview:
    name: Deploy Preview
    if: github.event.action != 'closed'
    runs-on: self-hosted

    steps:
      - name: Build and push PR image
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="pr-${{ github.event.number }}"
          trap 'rm -rf /tmp/dashboard-pr-build' EXIT
          rm -rf /tmp/dashboard-pr-build
          git clone https://x-access-token:$GH_TOKEN@github.com/Kapibaras/pegazzo-dashboard-ui.git /tmp/dashboard-pr-build
          cd /tmp/dashboard-pr-build
          git checkout ${{ github.event.pull_request.head.sha }}
          docker build -t $IMAGE:$TAG /tmp/dashboard-pr-build
          docker push $IMAGE:$TAG

      - name: Create and deploy Dokploy preview app
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOKPLOY_TOKEN: ${{ secrets.DOKPLOY_TOKEN }}
          NEXT_SESSION_SECRET: ${{ secrets.NEXT_SESSION_SECRET }}
        run: |
          PR_NUMBER=${{ github.event.number }}
          TAG="pr-${PR_NUMBER}"
          APP_NAME="dashboard-preview-pr-${PR_NUMBER}"
          DOMAIN="pr-${PR_NUMBER}.preview.pegazzoauto.com"

          # Create application
          APP_RESPONSE=$(curl -sf -X POST "$DOKPLOY_URL/api/application.create" \
            -H "x-api-key: $DOKPLOY_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"name\": \"$APP_NAME\", \"environmentId\": \"$ENVIRONMENT_ID\"}")

          APP_ID=$(echo $APP_RESPONSE | jq -r '.applicationId')
          echo "Created app: $APP_ID"

          # Configure Docker provider using stored registry credentials
          curl -sf -X POST "$DOKPLOY_URL/api/application.saveDockerProvider" \
            -H "x-api-key: $DOKPLOY_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{
              \"applicationId\": \"$APP_ID\",
              \"dockerImage\": \"$IMAGE:$TAG\",
              \"registryId\": \"$REGISTRY_ID\"
            }"

          # Set environment variables
          curl -sf -X POST "$DOKPLOY_URL/api/application.update" \
            -H "x-api-key: $DOKPLOY_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{
              \"applicationId\": \"$APP_ID\",
              \"env\": \"MONOLITH_API_BASE_URL=https://staging.api.pegazzoauto.com\nNEXT_SESSION_SECRET=${NEXT_SESSION_SECRET}\nENVIRONMENT=staging\"
            }"

          # Deploy
          curl -sf -X POST "$DOKPLOY_URL/api/application.deploy" \
            -H "x-api-key: $DOKPLOY_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"applicationId\": \"$APP_ID\"}"

          # Create domain
          curl -sf -X POST "$DOKPLOY_URL/api/domain.create" \
            -H "x-api-key: $DOKPLOY_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{
              \"host\": \"$DOMAIN\",
              \"applicationId\": \"$APP_ID\",
              \"https\": true,
              \"certificateType\": \"letsencrypt\",
              \"port\": 3000,
              \"path\": \"/\"
            }"

          # Comment on PR
          gh pr comment $PR_NUMBER \
            --repo Kapibaras/pegazzo-dashboard-ui \
            --body "🚀 **Preview deployment ready!**

**URL:** https://${DOMAIN}

> Uses staging as backend. Automatically deleted when this PR is closed."

  cleanup-preview:
    name: Cleanup Preview
    if: github.event.action == 'closed'
    runs-on: self-hosted

    steps:
      - name: Delete Dokploy preview app and image
        env:
          DOKPLOY_TOKEN: ${{ secrets.DOKPLOY_TOKEN }}
        run: |
          PR_NUMBER=${{ github.event.number }}
          APP_NAME="dashboard-preview-pr-${PR_NUMBER}"

          # Find app ID by name in the project
          APPS=$(curl -sf "$DOKPLOY_URL/api/project.all" \
            -H "x-api-key: $DOKPLOY_TOKEN")

          APP_ID=$(echo $APPS | jq -r \
            ".[0].environments[0].applications[] | select(.name == \"$APP_NAME\") | .applicationId")

          if [ -n "$APP_ID" ] && [ "$APP_ID" != "null" ]; then
            curl -sf -X POST "$DOKPLOY_URL/api/application.delete" \
              -H "x-api-key: $DOKPLOY_TOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"applicationId\": \"$APP_ID\"}"
            echo "Deleted preview app: $APP_NAME ($APP_ID)"
          else
            echo "No preview app found for PR #${PR_NUMBER}, skipping."
          fi

          # Remove PR image from local registry cache
          docker rmi $IMAGE:pr-${PR_NUMBER} || true
