name: Release

on:
  release:
    types: [published]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  retag:
    name: Retag Image
    runs-on: self-hosted

    steps:
      - name: Retag :main to :tag + :latest
        env:
          IMAGE: registry.pegazzoauto.com/pegazzo-dashboard
          TAG: ${{ github.event.release.tag_name }}
        run: |
          docker pull $IMAGE:main
          docker tag $IMAGE:main $IMAGE:$TAG
          docker tag $IMAGE:main $IMAGE:latest
          docker push $IMAGE:$TAG
          docker push $IMAGE:latest

  deploy-production:
    name: Deploy to Production
    needs: retag
    runs-on: ubuntu-latest
    environment: production

    concurrency:
      group: deploy-production
      cancel-in-progress: false

    steps:
      - name: Trigger Dokploy production webhook
        env:
          WEBHOOK_URL: ${{ secrets.DOKPLOY_DASHBOARD_PRODUCTION_WEBHOOK }}
        run: curl -fsS -X POST "$WEBHOOK_URL"

      - name: Print deployed URL
        run: |
          echo "SUCCESS — Dashboard released to production"
          echo "   URL: https://dashboard.pegazzo.com"
